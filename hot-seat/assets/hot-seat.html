<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>hot-seat</title>
<!-- Everything the page needs is in this file: no stylesheet, script, font or image is fetched, so the page looks the
     same on every machine and works offline. One design, two colour modes: dark is the default, light only swaps the
     tokens. The mode follows the system on first open; the user's choice is carried in the round payload and kept in
     the session state (localStorage is only an extra: it does not work inside Lavish's sandboxed frame). -->
<script>
(function () {
  var r = document.documentElement, t = r.getAttribute('data-theme');
  if (t !== 'dark' && t !== 'light') { try { t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { t = 'dark'; } r.setAttribute('data-theme', t); }
})();
</script>
<style>
:root{
  color-scheme:dark;
  --bg:#0e141b; --card:#151d27; --bar:#111922; --line:#28384a;
  --fg:#cfd9e3; --hi:#f1f5f8; --mute:#8c9eb0;
  --acc:#5cc8e6; --accfg:#06212b; --ok:#6fd6a8; --warn:#e9b566;
  --opt:#121a23; --sel:#17303a;
  --hl:color-mix(in oklab,var(--hi) 8%,transparent);
  --r:8px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --chrome:132px;
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#f5f2ec; --card:#ffffff; --bar:#efebe3; --line:#d9d2c6;
  --fg:#2d3238; --hi:#101418; --mute:#626971;
  --acc:#0e6b8c; --accfg:#ffffff; --ok:#1c7448; --warn:#9c5a08;
  --opt:#faf8f4; --sel:#e3f0f5;
  --hl:color-mix(in oklab,var(--hi) 6%,transparent);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
body{font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%;overflow:hidden}
:where(.hs-grid,.hs-main,.hs-choices,.hs-bar,.hs-top,.hs-foot,.hs-card>header)>*{min-width:0}
:where(p,h1,h2,h3,h4,li,dd,blockquote,label,summary,td,th,small,span,button){overflow-wrap:anywhere}
:where(img,svg,video,canvas,iframe){max-width:100%;height:auto}
h1,h2,h3,h4{margin:0;line-height:1.25;color:var(--hi)}
p{margin:0 0 .6em}
strong,b{color:var(--hi)}
code{font-family:var(--mono);font-size:.88em;background:var(--opt);border:1px solid var(--line);padding:.04em .32em;border-radius:5px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--mute)}
.small{font-size:13.5px}

/* app shell: top bar, one scrolling middle, bottom bar. The bar takes its own row, so it never sits on a card. */
.hs-app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh}
.hs-scroll{overflow:auto;min-height:0;overscroll-behavior:contain}
.hs-scroll:focus{outline:none}

/* top bar */
.hs-top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bar)}
.hs-brand{font-weight:700;color:var(--hi);display:flex;align-items:center;gap:8px}
.hs-brand i{width:10px;height:10px;border-radius:50%;background:var(--acc);flex:none}
.hs-topic{flex:1 1 240px;color:var(--fg);font-size:14px}
.hs-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media (max-width:640px){.hs-brand{order:1}.themesw{order:2;margin-left:auto}.hs-topic{order:3;flex-basis:100%}.hs-chips{order:4}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:0 9px;border-radius:999px;border:1px solid var(--line);font:400 12px/1.7 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);background:transparent;white-space:nowrap}
.chip.acc{border-color:var(--acc);color:var(--acc)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.mute{color:var(--mute)}
.hs-top .chip.mute{color:var(--fg)}
button.chip{cursor:pointer;min-height:32px;background:none}
.jump{display:none}
@media (max-width:899px){.jump{display:inline-flex}}
.themesw{position:relative;flex:none;width:56px;height:28px;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:0;cursor:pointer;color:var(--mute)}
.themesw .thumb{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--sel);border:1px solid var(--acc);transition:transform .15s}
.themesw[aria-checked=true] .thumb{transform:translateX(28px)}
.themesw svg{position:absolute;z-index:1;top:6px;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.themesw .moon{left:8px}.themesw .sun{right:8px}
.themesw[aria-checked=false] .moon,.themesw[aria-checked=true] .sun{color:var(--hi)}
@media (prefers-reduced-motion:reduce){.themesw .thumb{transition:none}}

/* layout */
.hs-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:14px 16px 20px;max-width:1240px;margin:0 auto}
@media (min-width:900px){.hs-grid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.hs-side{position:sticky;top:14px;max-height:calc(100vh - var(--chrome) - 28px);max-height:calc(100dvh - var(--chrome) - 28px);overflow:auto}}
@media (min-width:1100px){.hs-grid{grid-template-columns:minmax(0,1fr) 360px}}
.hs-main{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.panel h2{font-size:16px;font-weight:700;margin-bottom:6px}
.lab{font:400 12px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.strip{font-size:14px;color:var(--fg);border-left:2px solid var(--acc);padding:2px 0 2px 12px;margin:0 0 2px}
.strip .lab{display:block}
.strip p{margin:0 0 .3em}.strip p:last-child,.strip ul:last-child{margin-bottom:0}
.strip ul{margin:.2em 0 .4em;padding-left:1.2em}
.hs-hint{font-size:13.5px;color:var(--mute)}

/* folds: one line that opens on click */
.fold{border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.fold>summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:38px;padding:4px 12px;cursor:pointer;font-size:14px;color:var(--fg)}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"";flex:none;width:6px;height:6px;border:solid var(--mute);border-width:0 1.5px 1.5px 0;transform:rotate(-45deg);margin:0 3px 0 1px;transition:transform .12s}
.fold[open]>summary::before{transform:rotate(45deg)}
.fold>summary .muted{font-size:13.5px}
.fold-body{border-top:1px solid var(--line);padding:10px 14px 12px}
.fold.warn{border-left:3px solid var(--warn)}
.fold-body ul{margin:.2em 0;padding-left:1.2em}
.fold-body li{margin:.25em 0}
.fold-sub{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.fold-sub:first-child{margin-top:0;padding-top:0;border-top:0}

/* cards */
.hs-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.hs-card[data-state=sent]{opacity:.9}
.hs-card[data-active]{border-color:color-mix(in oklab,var(--acc) 55%,var(--line))}
.hs-card[data-active]::before,.hs-card[data-active]::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--acc);pointer-events:none}
.hs-card[data-active]::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-radius:var(--r) 0 0 0}
.hs-card[data-active]::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-radius:0 0 var(--r) 0}
.hs-card>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.hs-qn{font:700 12px/1.5 var(--mono);letter-spacing:.06em;color:var(--mute);white-space:nowrap;flex:none}
.hs-card[data-active] .hs-qn{color:var(--acc)}
.hs-card h3{flex:1 1 220px;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.hs-card>header .chip{align-self:center}
.hs-body{font-size:14.5px}
.hs-body p:last-child{margin-bottom:0}
.hs-body ul,.panel ul{margin:.3em 0 .6em;padding-left:1.2em;list-style:disc}
.panel li{margin:.2em 0}
.hs-choices{display:grid;gap:6px;border:0;margin:0;padding:0;min-width:0}
.hs-choice{display:grid;grid-template-columns:16px minmax(0,1fr);gap:2px 10px;align-items:start;padding:9px 12px;min-height:44px;border:1px solid var(--line);border-radius:calc(var(--r) - 2px);cursor:pointer;background:var(--opt)}
.hs-choice:hover{border-color:color-mix(in oklab,var(--acc) 50%,var(--line))}
.hs-choice:has(input:checked){border-color:var(--acc);background:var(--sel)}
.hs-choice .t{color:var(--hi);font-weight:600}
.hs-choice .t .chip{margin-left:6px;font-size:12px;vertical-align:1px}
.hs-choice small{display:block;grid-column:2;font-size:13.5px;color:var(--mute);margin-top:1px}
.hs-choice input{appearance:none;-webkit-appearance:none;position:relative;margin:3px 0 0;width:16px;height:16px;border:1.5px solid var(--mute);background:transparent;cursor:pointer;flex:none}
.hs-choice input[type=radio]{border-radius:50%}
.hs-choice input[type=checkbox]{border-radius:4px}
.hs-choice input[type=radio]:checked{border-color:var(--acc);background:var(--acc);box-shadow:inset 0 0 0 3px var(--sel)}
.hs-choice input[type=checkbox]:checked{border-color:var(--acc);background:var(--acc)}
.hs-choice input[type=checkbox]:checked::after{content:"";position:absolute;left:4px;top:0;width:4px;height:8px;border:solid var(--accfg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.hs-choice:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
.hs-choice input:focus-visible{outline:none}
.reco{border:1px dashed var(--line);border-radius:calc(var(--r) - 2px);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13.5px}
.reco>div{flex:1 1 240px}
.reco strong{color:var(--warn);font-weight:700}
textarea.hs-text{display:block;width:100%;min-height:40px;resize:vertical;padding:8px 10px;border-radius:calc(var(--r) - 2px);border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;field-sizing:content;max-height:260px}
textarea.hs-text::placeholder{color:var(--mute);opacity:1}
textarea.hs-text.big{min-height:92px}
.hs-foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start}
.hs-foot textarea{flex:1 1 260px;width:auto}
.hs-flags{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;min-height:40px}
.flag{display:inline-flex;align-items:center;gap:8px;min-height:32px;cursor:pointer;user-select:none;font-size:13.5px;color:var(--mute);white-space:nowrap}
.flag input{appearance:none;-webkit-appearance:none;position:relative;flex:none;margin:0;width:28px;height:16px;border-radius:999px;border:1px solid var(--mute);background:var(--opt);cursor:pointer;transition:background .12s,border-color .12s}
.flag input::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--mute);transition:transform .12s,background .12s}
.flag input:checked{background:var(--warn);border-color:var(--warn)}
.flag input:checked::after{transform:translateX(12px);background:var(--bg)}
.flag:has(input:checked){color:var(--warn)}
.flag input:disabled,.flag:has(input:disabled){cursor:not-allowed;opacity:.6}
@media (pointer:coarse){.flag{min-height:40px}}
@media (prefers-reduced-motion:reduce){.flag input,.flag input::after,.fold>summary::before{transition:none}}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:calc(var(--r) - 2px);border:1px solid var(--line);background:var(--opt);color:var(--fg);cursor:pointer;font-size:14px;transition:transform .05s,border-color .15s}
.btn2:hover:not(:disabled){border-color:var(--acc)}
.btn2:active:not(:disabled){transform:translateY(1px)}
.btn2:disabled{opacity:.5;cursor:not-allowed}
.btn2.primary{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
.btn2.sm{min-height:34px;padding:0 12px;font-size:13.5px}
.err-msg{color:var(--warn);font-size:13.5px}
.err-msg:empty{display:none}
figure{margin:0}
figure svg,figure img{border-radius:calc(var(--r) - 2px);border:1px solid var(--line);background:var(--opt);color:var(--fg)}
.hs-mock{border:1px solid var(--line);border-radius:calc(var(--r) - 2px);background:var(--opt);padding:12px;overflow:auto}
.hs-frame{width:100%;border:1px solid var(--line);border-radius:calc(var(--r) - 2px);background:#fff}
figcaption{color:var(--mute);font-size:13.5px;margin-top:4px}

/* bottom bar */
.hs-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;background:var(--bar);border-top:1px solid var(--line)}
.hs-bar .inner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;width:100%;max-width:1208px;margin:0 auto}
.hs-bar .prog{flex:1 1 220px;font-size:14px;color:var(--fg)}
.hs-bar .btn2{flex:0 0 auto}
.hs-nudge{flex:1 1 100%;color:var(--warn);font-size:13.5px}
.hs-nudge:empty{display:none}
.hs-steer{display:flex;flex-direction:column;gap:6px}
@media (max-width:640px){.hs-bar .prog .hide-s{display:none}.hs-bar .btn2{flex:1 1 auto}}

/* history */
.hs-hist{display:grid;gap:10px}
.hs-hq{border-top:1px solid var(--line);padding-top:8px}
.hs-hq:first-child{border-top:0;padding-top:0}
.hs-hq q{quotes:"\201C" "\201D";font-style:italic}
blockquote{margin:.3em 0;padding:.2em .8em;border-left:3px solid var(--line);color:var(--mute)}
.hs-h2{font:400 12px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:6px 0 0}

/* side rail */
.hs-side{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tabs2{display:flex;justify-content:space-between;gap:2px;border-bottom:1px solid var(--line);margin:0 -2px}
.tab2{flex:0 1 auto;min-height:36px;padding:0 5px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--mute);cursor:pointer;font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tab2:hover{color:var(--fg)}
.tab2[aria-selected=true]{color:var(--hi);border-bottom-color:var(--acc)}
.tab2 .n{margin-left:5px;font-weight:400}
.tabpane{display:none;min-width:0}
.tabpane.on{display:block}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:4px;padding-left:12px;border-left:1px solid var(--line)}
.node{display:flex;gap:9px;align-items:flex-start;padding:4px 0;font-size:14px;line-height:1.35;color:var(--fg)}
.node .dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;border:1.5px solid var(--mute)}
.node.settled .dot{background:var(--ok);border-color:var(--ok)}
.node.frontier{color:var(--hi)}
.node.frontier .dot{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in oklab,var(--acc) 28%,transparent)}
.node.blocked{color:var(--mute)}
.node.blocked .dot{border-style:dashed}
.node.running .dot{border-color:var(--mute);box-shadow:0 0 0 3px color-mix(in oklab,var(--mute) 28%,transparent)}
.node.parked .dot{border-radius:2px;transform:rotate(45deg);background:var(--warn);border-color:var(--warn)}
.legend{display:grid;grid-template-columns:repeat(3,max-content);justify-content:start;gap:4px 18px;font-size:12px;color:var(--mute);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--mute)}
.legend .l-ok{background:var(--ok);border-color:var(--ok)}
.legend .l-now{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in oklab,var(--acc) 28%,transparent)}
.legend .l-wait{border-style:dashed}
.legend .l-look{box-shadow:0 0 0 2px color-mix(in oklab,var(--mute) 28%,transparent)}
.legend .l-park{border-radius:2px;transform:rotate(45deg);background:var(--warn);border-color:var(--warn)}
.led{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;font-size:13.5px;color:var(--mute)}
.led .lab{display:block;margin-bottom:2px}
.led div+div{margin-top:6px}
.led b{color:var(--hi);font-weight:600}
.led .d{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dec{border-bottom:1px solid var(--line);padding:8px 0}
.dec:last-child{border-bottom:0}
.dec h4{font-size:14.5px;margin-bottom:3px}
.gates{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
pre{margin:0;font-family:var(--mono);font-size:12px;line-height:1.45;background:var(--bg);border:1px solid var(--line);border-radius:calc(var(--r) - 2px);padding:8px 10px;overflow-x:auto;max-width:100%;white-space:pre}
pre.wrap{white-space:pre-wrap;overflow-wrap:anywhere}
.diff .a{color:var(--ok)}
.diff .d{color:var(--mute);text-decoration:line-through}
.diff .h{color:var(--mute)}
.rule{padding:6px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule b{font:700 12px var(--mono);letter-spacing:.06em;color:var(--mute);margin-right:6px}
.dot-run{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}}
.hs-empty{padding:28px 16px;text-align:center;color:var(--mute)}

@media print{body{overflow:visible;height:auto}.hs-app{display:block;height:auto}.hs-scroll{overflow:visible}.hs-bar{display:none}.hs-side{position:static;max-height:none}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p class="hs-empty">This page needs JavaScript to render the session.</p></noscript>
<script id="hs-state" type="application/json">null</script>
<script>
(() => {
'use strict';
const S = JSON.parse(document.getElementById('hs-state').textContent);
const $app = document.getElementById('app');
if (!S) { $app.innerHTML = '<p class="hs-empty">hot-seat template: no session state embedded. Run <code>hot-seat.mjs init</code>.</p>'; return; }

// ---------------------------------------------------------------- utils
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const arr = (x) => (Array.isArray(x) ? x : x == null || x === '' ? [] : [x]);
const inline = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
function md(t) {
  const blocks = String(t ?? '').trim().split(/\n{2,}/);
  return blocks.map((b) => {
    const ls = b.split('\n');
    if (ls.every((l) => /^\s*[-*] /.test(l))) return '<ul>' + ls.map((l) => `<li>${inline(l.replace(/^\s*[-*] /, ''))}</li>`).join('') + '</ul>';
    return `<p>${ls.map(inline).join('<br>')}</p>`;
  }).join('');
}
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage blocked */ } } };
const round = S.rounds[S.rounds.length - 1];
const prevRounds = S.rounds.slice(0, -1);
const DRAFT_KEY = `hs:${S.session}:${round.n}`;
const SENT_KEY = `hs:sent:${S.session}:${round.n}`;
const interactive = S.status !== 'done' && round.questions.length > 0;
let draft = store.get(DRAFT_KEY) || { answers: {}, steer: '' };
let sentAt = store.get(SENT_KEY);
const A = (id) => (draft.answers[id] ||= { choice: null, choices: [], text: (round.questions.find((x) => x.id === id) || {}).prefill || '', dontKnow: false, prototype: false, skip: false });
const inLavish = () => typeof window.lavish !== 'undefined' && window.lavish && typeof window.lavish.queuePrompt === 'function';

// ---------------------------------------------------------------- colour mode
// Dark is the default; with no choice the system preference decides. A choice (the switch in the top bar) wins, travels
// with the round payload and is kept in the session state, so it survives the rebuild for the next round.
const MODES = ['dark', 'light'];
const sysLight = typeof matchMedia === 'function' ? matchMedia('(prefers-color-scheme: light)') : null;
let themeChoice = MODES.includes(S.theme) ? S.theme : MODES.includes(store.get('hs:theme')) ? store.get('hs:theme') : null;
const curTheme = () => themeChoice || (sysLight && sysLight.matches ? 'light' : 'dark');
function applyTheme() {
  document.documentElement.setAttribute('data-theme', curTheme());
  const b = document.querySelector('.themesw'); if (b) b.setAttribute('aria-checked', String(curTheme() === 'light'));
}
if (sysLight && sysLight.addEventListener) sysLight.addEventListener('change', () => { if (!themeChoice) applyTheme(); });

function stance(q, a) {
  if (!a) return 'open';
  if (a.skip) return 'skipped';
  if (a.dontKnow) return 'unsure';
  const chosen = a.choices && a.choices.length ? a.choices : arr(a.choice);
  const text = (a.text || '').trim();
  if (q.kind === 'confirm') return chosen.length ? 'answered' : 'open';
  if (q.kind === 'free') return text ? (q.recommended && text === String(q.recommended).trim() ? 'agreed' : 'own-words') : a.prototype ? 'prototype' : 'open';
  if (!chosen.length && !text) return a.prototype ? 'prototype' : 'open';
  if (!chosen.length) return 'own-words';
  const reco = arr(q.recommended);
  return chosen.length === reco.length && chosen.every((c) => reco.includes(c)) ? 'agreed' : 'differed';
}
// accent = the user's own answer, amber = not settled by talk, green only for settled things
const STANCE = { agreed: ['acc', 'Agreed'], differed: ['acc', 'Chose differently'], 'own-words': ['acc', 'Own words'], unsure: ['warn', "Don't know"], prototype: ['warn', 'Needs prototype'], skipped: ['mute', 'Out of scope'], answered: ['acc', 'Answered'], open: ['mute', 'Open'] };
const chip = (kind, text, title) => `<span class="chip ${kind}"${title ? ` title="${esc(title)}"` : ''}>${esc(text)}</span>`;

// ---------------------------------------------------------------- header
const settledN = S.tree.filter((n) => n.state === 'settled').length;
const parkedN = S.tree.filter((n) => n.state === 'parked').length;
const modeLabel = S.mode.value === 'docs' ? 'Codebase' : 'Stateless';
const ICON = { moon: '<svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>', sun: '<svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' };
function header() {
  return `<header class="hs-top" id="top">
    <div class="hs-brand"><i aria-hidden="true"></i>hot-seat</div>
    <div class="hs-topic">${S.title || S.topic ? esc(S.title || S.topic) : 'New session'}</div>
    <div class="hs-chips">
      ${chip('mute', modeLabel, `${S.mode.value === 'docs' ? 'Paper trail on' : 'Nothing is written to your workspace'}: ${S.mode.reason}`)}
      ${chip('acc', S.status === 'done' ? 'Session complete' : `Round ${round.n}`)}
      ${chip('mute', `${settledN} settled${parkedN ? `, ${parkedN} parked` : ''} of ${S.tree.length}`)}
      <button type="button" class="chip acc jump" data-act="jump" aria-label="Jump to the tree, ledger and terms">Overview</button>
    </div>
    <button type="button" class="themesw" role="switch" aria-checked="${curTheme() === 'light'}" aria-label="Light mode" title="Switch between dark and light" data-act="theme">${ICON.moon}${ICON.sun}<span class="thumb"></span></button>
  </header>`;
}

// ---------------------------------------------------------------- cards
function figure(q) {
  const f = q.figure;
  if (!f) return '';
  const strip = (h) => String(h).replace(/<script[\s\S]*?<\/script>/gi, '').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi, '');
  const body = f.svg ? strip(f.svg) : f.html ? `<div class="hs-mock">${strip(f.html)}</div>` : f.frame ? `<iframe class="hs-frame" src="${esc(f.frame)}" title="${esc(f.alt || 'prototype')}" sandbox="allow-scripts" style="height:${+f.height || 360}px"></iframe>` : f.img ? `<img src="${esc(f.img)}" alt="${esc(f.alt || '')}">` : '';
  return body ? `<figure>${body}${f.caption ? `<figcaption>${esc(f.caption)}</figcaption>` : ''}</figure>` : '';
}
function card(q) {
  const a = A(q.id);
  const st = sentAt ? 'sent' : stance(q, a) === 'open' ? 'open' : 'draft';
  const [k, label] = STANCE[stance(q, a)];
  const reco = arr(q.recommended);
  const type = q.multi ? 'checkbox' : 'radio';
  const locked = sentAt ? 'disabled' : '';
  let choices = '';
  if (q.kind !== 'free') {
    choices = `<fieldset class="hs-choices" ${locked}><legend class="sr">Choices for ${esc(q.id)}</legend>` + arr(q.choices).map((c) => {
      const on = q.multi ? (a.choices || []).includes(c.id) : a.choice === c.id;
      return `<label class="hs-choice"><input type="${type}" name="${esc(q.id)}" value="${esc(c.id)}" data-q="${esc(q.id)}" data-role="choice" ${on ? 'checked' : ''}>
        <span class="t">${inline(c.label)}${reco.includes(c.id) ? chip('warn', 'Recommended') : ''}</span>${c.detail ? `<small>${inline(c.detail)}</small>` : ''}</label>`;
    }).join('') + '</fieldset>';
  }
  let recoBox = '';
  if (!q.noRecommendation && q.kind === 'choice') {
    const names = reco.map((r) => `(${esc(r)}) ${inline((q.choices.find((c) => c.id === r) || {}).label || r)}`).join(' + ');
    recoBox = `<div class="reco"><div><strong>Recommended:</strong> ${names}<br><span class="muted">${inline(q.why)}</span></div>
      <button type="button" class="btn2 sm" data-act="use-reco" data-q="${esc(q.id)}" ${locked}>Agree with this</button></div>`;
  } else if (!q.noRecommendation && q.kind === 'free') {
    recoBox = `<div class="reco"><div><strong>Recommended answer:</strong> ${inline(q.recommended)}<br><span class="muted">${inline(q.why)}</span></div>
      <button type="button" class="btn2 sm" data-act="use-reco-text" data-q="${esc(q.id)}" ${locked}>Use this text</button></div>`;
  }
  const ph = q.kind === 'free' ? 'Your answer' + (q.required ? ' (required)' : '') : q.kind === 'confirm' ? 'What is off? (needed if you say "Not yet")' : 'Your words, or push back (optional)';
  const sw = (role, on, text, title) => `<label class="flag"${title ? ` title="${esc(title)}"` : ''}><input type="checkbox" role="switch" data-q="${esc(q.id)}" data-role="${role}" ${on ? 'checked' : ''} ${locked}><span>${text}</span></label>`;
  const flags = q.kind === 'confirm' ? '' : `<div class="hs-flags">
      ${sw('dontKnow', a.dontKnow, "I don't know")}
      ${sw('prototype', a.prototype, 'Needs a prototype', 'Some questions cannot be answered by talking. I will try to show you something cheap to react to.')}
      ${q.required ? '' : sw('skip', a.skip, 'Out of scope', 'Not part of this session. I will park it and stop asking.')}</div>`;
  return `<article class="hs-card" id="${esc(q.id)}" data-state="${st}" data-q="${esc(q.id)}">
    <header><span class="hs-qn">${esc(q.id)}</span><h3>${inline(q.title)}</h3>${q.stakes === 'low' ? chip('mute', 'low stakes', 'Safe to accept my recommendation') : ''}<span class="chip ${k}" data-role="stance">${sentAt ? 'Sent' : label}</span></header>
    <div class="hs-body">${md(q.body)}</div>${q.basis ? `<div class="small muted">Based on: ${inline(q.basis)}</div>` : ''}${figure(q)}${choices}${recoBox}
    <div class="hs-foot"><textarea class="hs-text${q.kind === 'free' ? ' big' : ''}" data-q="${esc(q.id)}" data-role="text" placeholder="${esc(ph)}" aria-label="${esc(ph)}" ${locked}>${esc(a.text)}</textarea>${flags}</div>
    <div class="err-msg" data-err="${esc(q.id)}" role="alert"></div>
  </article>`;
}

function historyRound(r) {
  const rows = r.questions.map((q) => {
    const a = q.answer, s = a ? a.stance : 'open';
    const [k, label] = STANCE[s] || STANCE.open;
    const chosen = a ? (a.choices && a.choices.length ? a.choices : arr(a.choice)) : [];
    const labs = chosen.map((id) => `(${esc(id)}) ${inline((q.choices || []).find((c) => c.id === id)?.label || id)}`).join(' + ');
    const reco = arr(q.recommended).map((id) => (q.choices || []).find((c) => c.id === id)?.label || id).join(' + ');
    return `<div class="hs-hq"><div><span class="hs-qn">${esc(q.id)}</span> <strong>${inline(q.title)}</strong> ${chip(k, label)}</div>
      ${labs ? `<div>You chose: ${labs}</div>` : ''}
      ${a && a.text ? `<blockquote>${esc(a.text)}</blockquote>` : ''}
      ${a && a.prototype ? '<div class="small muted">Flagged: needs a prototype.</div>' : ''}
      ${q.kind === 'choice' && reco && s !== 'agreed' ? `<div class="small muted">I recommended: ${inline(reco)}</div>` : ''}</div>`;
  }).join('');
  const c = {};
  r.questions.forEach((q) => { const s = q.answer ? q.answer.stance : 'open'; c[s] = (c[s] || 0) + 1; });
  return `<details class="fold hs-round"><summary><strong>Round ${r.n}</strong><span class="muted">${r.questions.length} question${r.questions.length === 1 ? '' : 's'}: ${Object.entries(c).map(([s, n]) => `${n} ${(STANCE[s] || [0, s])[1].toLowerCase()}`).join(', ')}</span></summary>
    <div class="fold-body hs-hist">${r.note ? `<div class="small muted">${md(r.note)}</div>` : ''}${r.steer ? `<div><span class="small muted">Your steering:</span><blockquote>${esc(r.steer)}</blockquote></div>` : ''}${rows}${writesBody(r)}</div></details>`;
}

function writesBody(r) {
  if (S.mode.value !== 'docs' || !r.writes || !r.writes.length) return '';
  return r.writes.map((w) => `<details><summary><code>${esc(w.file)}</code> ${chip(w.status === 'added' ? 'ok' : 'mute', w.status)} <span class="muted small">+${w.added} -${w.removed}, ${w.kind === 'adr' ? 'ADR' : 'glossary'}</span></summary>
    <pre class="diff">${esc(w.diff).split('\n').map((l) => `<span class="${l[0] === '+' ? 'a' : l[0] === '-' ? 'd' : 'h'}">${l}</span>`).join('\n')}</pre></details>`).join('');
}
function writesFold(r) {
  if (S.mode.value !== 'docs') return '';
  if (!r.writes || !r.writes.length) return r.n > 1 ? `<div class="hs-hint">Paper trail: nothing was written to the repository since your last answers.</div>` : '';
  return `<details class="fold"><summary><strong>Paper trail</strong><span class="muted">${r.writes.length} file${r.writes.length === 1 ? '' : 's'} written since your last answers</span></summary><div class="fold-body">${writesBody(r)}</div></details>`;
}

// ---------------------------------------------------------------- main column
function steerFold() {
  return `<details class="fold"><summary><strong>How to steer this session</strong><span class="muted">push back, say "I don't know", flag what talk cannot settle</span></summary>
    <div class="fold-body"><ul class="small">
      <li><strong>Push back.</strong> If a question is pitched too low, or my recommendation is wrong, say so in the box on that card. Agreeing with everything means you did not need a session.</li>
      <li><strong>"I don't know" is an answer.</strong> Say it and mean it. I will ask a smaller question or look the fact up myself.</li>
      <li><strong>Flag what talk cannot settle.</strong> "Needs a prototype" parks the question until you have something to react to.</li>
      <li><strong>Correct the scope.</strong> Too big, drifting, wrong topic: use the steer box at the bottom. You can also select any text on the page and annotate it.</li>
      <li>Facts are my job. If I ask you something I could have looked up, tell me.</li>
    </ul></div></details>`;
}
function factsFold() {
  const running = S.facts.filter((f) => f.state === 'running');
  const done = S.facts.filter((f) => f.state === 'done');
  if (!running.length && !done.length) return '';
  return `<details class="fold"><summary><strong>Fact-finding</strong><span class="muted">${done.length} found${running.length ? `, ${running.length} running` : ''}: not asked of you</span></summary><div class="fold-body">
    ${running.map((f) => `<div class="fold-sub"><span class="dot-run pulse"></span> <strong>Looking up:</strong> ${inline(f.title)} <span class="muted small">(questions that depend on it wait for a later round)</span></div>`).join('')}
    ${done.map((f) => `<div class="fold-sub small"><strong>${inline(f.title)}</strong><br><span class="muted">${inline(f.result || '')}</span></div>`).join('')}</div></details>`;
}
function warnFold() {
  if (!round.warnings || !round.warnings.length) return '';
  return `<details class="fold warn"><summary><strong>${round.warnings.length} consistency check${round.warnings.length === 1 ? '' : 's'} flagged on this round</strong></summary><div class="fold-body"><ul class="small">${round.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></div></details>`;
}
function bar() {
  return `<div class="hs-bar" id="bar"><div class="inner"><div class="prog" id="counts" role="status" aria-live="polite"></div><div class="hs-nudge" id="nudge"></div>
    <button type="button" class="btn2 sm" id="nextopen" data-act="next-open">Next open</button>
    <button type="button" class="btn2 sm" id="acceptlow" data-act="accept-low" title="Sets every still-open low-stakes card to my recommendation. Nothing is sent until you press send: you can review and change each one."></button>
    <button type="button" class="btn2 primary" id="send" data-act="send"></button></div></div>`;
}
function mainCol() {
  const p = [];
  if (S.status === 'done') {
    p.push(`<section class="panel"><h2>Session complete</h2>${md(round.summary || 'Shared understanding confirmed.')}<p class="muted small">Nothing was acted on. Copy the ledger from the Ledger tab and hand it to whatever comes next, in this same conversation.</p></section>`);
  } else {
    if (round.note) p.push(`<div class="strip"><span class="lab">${round.n === 1 ? 'Before we start' : 'Since your last answers'}</span>${md(round.note)}</div>`);
    if (round.summary) p.push(`<section class="panel"><h2>Shared understanding, in my words</h2>${md(round.summary)}${(S.assumptions || []).length ? `<h3 style="font-size:14.5px;margin-top:8px">Inferred by me, not said by you: check these</h3><ul>${S.assumptions.map((a) => `<li>${inline(a.text)}</li>`).join('')}</ul>` : ''}</section>`);
    if (sentAt) p.push('<div class="hs-hint" role="status">Round sent. I am working on it: this page will reload with the next round.</div>');
    p.push(...round.questions.map(card));
    p.push(`<section class="panel hs-steer"><h2>Steer the session <span class="muted small">(optional)</span></h2>
      <textarea class="hs-text" id="steer" placeholder="Push back on the interview itself: scope too big, wrong topic, questions too shallow, something to add or drop..." aria-label="Steer the session" ${sentAt ? 'disabled' : ''}>${esc(draft.steer)}</textarea></section>`);
    p.push(steerFold(), factsFold(), writesFold(round), warnFold());
  }
  if (prevRounds.length) p.push(`<h2 class="hs-h2">History</h2>` + prevRounds.slice().reverse().map(historyRound).join(''));
  return `<main class="hs-main">${p.join('')}</main>`;
}

// ---------------------------------------------------------------- side rail
const NODE = { settled: ['ok', 'Settled'], frontier: ['acc', 'Open: asked now'], blocked: ['mute', 'Waiting on another decision'], running: ['mute', 'Waiting on a lookup'], parked: ['warn', 'Parked'] };
function treeHtml() {
  const kids = {}; S.tree.forEach((n) => { const p = n.parent && S.tree.some((x) => x.id === n.parent) ? n.parent : '_'; (kids[p] ||= []).push(n); });
  const li = (n) => {
    const tip = `${n.title} - ${(NODE[n.state] || [0, n.state])[1]}${n.decision ? ': ' + n.decision : ''}${n.parkedReason ? ': ' + n.parkedReason : ''}`;
    return `<li><div class="node ${esc(n.state)}" title="${esc(tip)}"><i class="dot${n.state === 'running' ? ' pulse' : ''}" aria-hidden="true"></i><span><span class="sr">${esc((NODE[n.state] || [0, n.state])[1])}: </span>${esc(n.title)}</span></div>${kids[n.id] ? `<ul>${kids[n.id].map(li).join('')}</ul>` : ''}</li>`;
  };
  return `<ul class="tree" aria-label="Design tree of decisions">${(kids._ || []).map(li).join('')}</ul>`;
}
// the last decisions settled: nodes ranked by the latest round that asked about them, then by tree order
function lastSettled() {
  const asked = {}; S.rounds.forEach((r) => r.questions.forEach((q) => { asked[q.node] = Math.max(asked[q.node] || 0, r.n); }));
  const idx = new Map(S.tree.map((n, i) => [n.id, i]));
  return S.tree.filter((n) => n.state === 'settled' && n.id !== 'dm' && n.decision).sort((a, b) => ((asked[b.id] || 0) - (asked[a.id] || 0)) || idx.get(b.id) - idx.get(a.id)).slice(0, 3);
}
function treeTab() {
  const ls = lastSettled();
  return `${treeHtml()}<div class="legend"><span><i class="l-ok"></i>settled</span><span><i class="l-now"></i>asked now</span><span><i class="l-wait"></i>waiting</span><span><i class="l-look"></i>lookup</span><span><i class="l-park"></i>parked</span></div>
    ${ls.length ? `<div class="led"><span class="lab">Last settled</span>${ls.map((n) => `<div><b>${inline(n.title)}.</b> <span class="d">${inline(n.decision)}</span></div>`).join('')}</div>` : ''}`;
}
function ledgerTab() {
  const settled = S.tree.filter((n) => n.state === 'settled' && n.id !== 'dm');
  const parked = S.tree.filter((n) => n.state === 'parked');
  const qs = S.rounds.flatMap((r) => r.questions.map((q) => ({ ...q, round: r.n })));
  const dec = settled.map((n, i) => {
    const q = qs.filter((x) => x.node === n.id && x.answer && x.kind !== 'confirm');
    const words = q.map((x) => x.answer.text).filter(Boolean);
    return `<div class="dec"><h4>${esc(n.id)}. ${inline(n.title)}</h4><div>${inline(n.decision)}</div>${words.length ? `<blockquote class="small">${words.map(esc).join('<br>')}</blockquote>` : ''}<div class="small muted">${q.map((x) => `${x.id}, round ${x.round}`).join(' | ')}</div></div>`;
  }).join('') || '<p class="muted small">No settled decisions yet. Every answer you send lands here.</p>';
  const asm = (S.assumptions || []).length ? `<h4 style="margin-top:10px">Derived by me, not said by you</h4><p class="small muted">Check these: they are inferences.</p>${S.assumptions.map((a) => `<div class="dec small">${inline(a.text)}<div class="muted">round ${a.round}</div></div>`).join('')}` : '';
  const pk = parked.length ? `<h4 style="margin-top:10px">Parked</h4>${parked.map((n) => `<div class="dec"><strong>${inline(n.title)}</strong><div class="small muted">${inline(n.parkedReason)}</div></div>`).join('')}` : '';
  return `${dec}${pk}${asm}<h4 style="margin-top:12px">Export</h4><p class="small muted">The whole ledger as markdown. Hand it to whatever comes next (a spec, tickets, a plan): the answers survive there exactly as decided.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0"><button type="button" class="btn2 sm" data-act="copy-ledger">Copy ledger</button><button type="button" class="btn2 sm" data-act="dl-ledger">Download .md</button><span class="small muted" id="copied" role="status"></span></div>
    <pre class="wrap" id="ledger-md" style="max-height:260px;overflow:auto">${esc(S.ledgerMd)}</pre>`;
}
function termChips(g, docs) {
  if (g.status === 'existing') return chip('mute', 'already in CONTEXT.md, unchanged');
  if (g.status === 'rejected') return chip('mute', 'considered, not added');
  if (g.status === 'conflict') return chip('warn', 'conflict: unresolved');
  if (g.status === 'proposed') return chip('warn', 'proposed');
  return chip('ok', 'resolved') + (docs ? (g.written ? chip('ok', 'written to ' + (g.file || 'CONTEXT.md')) : chip('warn', 'not written yet')) : chip('mute', 'session only'));
}
function termsTab() {
  const docs = S.mode.value === 'docs';
  if (!S.glossary.length) return `<p class="muted small">${docs ? 'No term has resolved yet. When one does it is written to CONTEXT.md right then, and shows here.' : 'No term has resolved yet. In stateless mode terms stay on this page and in the ledger; nothing is written to your workspace.'}</p>`;
  return S.glossary.map((g) => `<div class="dec"><h4>${esc(g.term)}${g.fr ? ` <span class="muted small">(fr: ${esc(g.fr)})</span>` : ''}</h4><div class="small">${inline(g.definition)}</div>
    ${g.avoid && g.avoid.length ? `<div class="small muted">Avoid: ${g.avoid.map(esc).join(', ')}</div>` : ''}
    <div class="gates">${termChips(g, docs)}</div>
    ${g.note ? `<div class="small muted">${inline(g.note)}</div>` : ''}${g.conflict ? `<div class="small" style="color:var(--warn)">${inline(g.conflict)}</div>` : ''}</div>`).join('');
}
function adrsTab() {
  const rule = `<p class="small muted">An ADR needs <strong>all three</strong>: hard to reverse, surprising without context, and a real trade-off. Miss one and there is no ADR. Most sessions write none.</p>`;
  if (!S.adrs.length) return rule + '<p class="muted small">No ADR candidate yet.</p>';
  const gate = (a, k, name) => { const g = (a.gates || {})[k]; return `<span class="chip ${g && g.met ? 'ok' : 'mute'}" title="${esc(g && g.why || '')}">${g && g.met ? 'yes' : 'no'}: ${name}</span>`; };
  return rule + S.adrs.map((a) => `<div class="dec"><h4>${inline(a.title)}</h4><div class="gates">${gate(a, 'hardToReverse', 'hard to reverse')}${gate(a, 'surprising', 'surprising')}${gate(a, 'tradeoff', 'real trade-off')}</div>
    <div>${chip(a.status === 'written' ? 'ok' : a.status === 'skipped' ? 'mute' : 'warn', a.status)}${a.file ? ` <code>${esc(a.file)}</code>` : ''}</div>
    ${a.skipReason ? `<div class="small muted">Skipped${a.skippedBy ? ' by ' + esc(a.skippedBy) : ''}: ${inline(a.skipReason)}</div>` : ''}
    ${['hardToReverse', 'surprising', 'tradeoff'].map((k) => (a.gates && a.gates[k] && a.gates[k].why) ? `<div class="small muted">${esc(a.gates[k].why)}</div>` : '').join('')}</div>`).join('');
}
function contractTab() {
  const src = (S.contract.upstream || []).length ? `Upstream skills also found: ${S.contract.upstream.map((u) => `<code>${esc(u.name)}</code>`).join(', ')} (optional; this inline contract is what runs).` : 'No upstream grilling / domain-modeling skill found. That is fine: this contract is inline in the skill and is the whole interview.';
  let g = '';
  return `<p class="small muted">These are the rules this session runs under. If a round ever breaks one (no recommendation, no paper trail in codebase mode), say so: the round builder refuses to render questions without a recommendation and cross-checks CONTEXT.md and ADR files against what was claimed.</p><p class="small">${src}</p>` +
    S.contract.rules.filter((r) => S.mode.value === 'docs' || r.group.indexOf('Paper') !== 0).map((r) => { const head = r.group !== g ? `<h4 style="margin-top:10px">${esc(r.group)}</h4>` : ''; g = r.group; return `${head}<div class="rule"><b>${esc(r.id)}</b>${inline(r.text)} <span class="muted small">(${esc(r.src)})</span></div>`; }).join('') +
    `<p class="small muted" style="margin-top:10px">Session ${esc(S.session)}, contract v${esc(S.contract.version)}, mode ${esc(S.mode.value)} (${esc(S.mode.reason)}).</p>`;
}
// Panes render lazily (first open): keeps the DOM small, which keeps the poll's DOM snapshot small.
const PANES = { tree: treeTab, ledger: ledgerTab, terms: termsTab, adrs: adrsTab, contract: contractTab };
function fillPane(id) { const el = document.getElementById('pane-' + id); if (el && !el.dataset.filled) { el.innerHTML = PANES[id](); el.dataset.filled = '1'; } }
function sidebar() {
  const docs = S.mode.value === 'docs';
  const tabs = [
    ['tree', 'Tree', S.tree.length], ['ledger', 'Ledger', S.tree.filter((n) => n.state === 'settled' && n.id !== 'dm').length],
    ['terms', docs ? 'Glossary' : 'Terms', S.glossary.length], ['adrs', 'ADRs', S.adrs.length], ['contract', 'Rules', ''],
  ];
  const on = store.get(`hs:tab:${S.session}`) || 'tree';
  return `<aside class="hs-side" aria-label="Session overview"><div class="tabs2" role="tablist">${tabs.map(([id, l, n]) => `<button type="button" role="tab" class="tab2" id="tab-${id}" data-act="tab" data-tab="${id}" aria-selected="${id === on}" aria-controls="pane-${id}">${l}${n ? `<span class="n">${n}</span>` : ''}</button>`).join('')}</div>
    ${tabs.map(([id]) => `<div class="tabpane ${id === on ? 'on' : ''}" role="tabpanel" id="pane-${id}" aria-labelledby="tab-${id}"></div>`).join('')}</aside>`;
}

// ---------------------------------------------------------------- interactions
let activeQ = null;
function setActive(id) {
  if (id === activeQ) return; activeQ = id;
  document.querySelectorAll('.hs-card').forEach((c) => { if (c.id === id) c.setAttribute('data-active', ''); else c.removeAttribute('data-active'); });
}
function refresh() {
  if (!interactive) return;
  const c = {}; let anyAnswered = false;
  round.questions.forEach((q) => {
    const a = draft.answers[q.id], s = stance(q, a); c[s] = (c[s] || 0) + 1; if (s !== 'open') anyAnswered = true;
    const el = document.getElementById(q.id); if (!el) return;
    el.dataset.state = sentAt ? 'sent' : s === 'open' ? 'open' : 'draft';
    const [k, l] = STANCE[s]; const ch = el.querySelector('[data-role=stance]'); ch.className = `chip ${k}`; ch.textContent = sentAt ? 'Sent' : l;
  });
  const answered = round.questions.filter((q) => stance(q, draft.answers[q.id]) !== 'open');
  const counts = document.getElementById('counts');
  counts.title = Object.entries(c).map(([s, n]) => `${n} ${STANCE[s][1].toLowerCase()}`).join(', ');
  counts.innerHTML = sentAt ? `Round ${round.n} sent. I am working on it: this page reloads with the next round.` : `<strong>${answered.length} of ${round.questions.length}</strong> answered<span class="hide-s">. Nothing is sent until you press Send.</span>`;
  const sendBtn = document.getElementById('send');
  sendBtn.disabled = !!sentAt || (!anyAnswered && !(draft.steer || '').trim());
  sendBtn.textContent = sentAt ? 'Sent, waiting for the agent' : `Send round ${round.n}`;
  const low = round.questions.filter((x) => x.stakes === 'low' && !x.noRecommendation && x.kind !== 'confirm' && stance(x, draft.answers[x.id]) === 'open');
  const al = document.getElementById('acceptlow'); if (al) { al.hidden = !!sentAt || low.length < 2; al.textContent = `Accept ${low.length} low-stakes`; }
  const no = document.getElementById('nextopen'); if (no) no.hidden = !!sentAt || !round.questions.some((x) => stance(x, draft.answers[x.id]) === 'open');
  const nudge = document.getElementById('nudge');
  nudge.textContent = !sentAt && answered.length >= 3 && answered.every((q) => stance(q, draft.answers[q.id]) === 'agreed')
    ? 'You agreed with every recommendation. Is any of them really a coin flip for you? Push back on one, or flag it, before sending.' : '';
  store.set(DRAFT_KEY, draft);
  scheduleDraftQueue();
}
// The latest draft is kept queued in Lavish (same queueKey = it REPLACES the previous draft), so anything the
// user sends from the Lavish chrome ("Send to Agent", "Send & End") carries their current answers instead of
// losing them. The explicit send button below is still the primary path: it queues the same key and sends now.
let dqTimer = null, everQueued = false, lastQueued = '';
function scheduleDraftQueue() {
  if (!inLavish() || sentAt) return;
  clearTimeout(dqTimer);
  dqTimer = setTimeout(() => {
    const pl = payload(false);
    const n = pl.answers.filter((a, i) => stance(round.questions[i], a) !== 'open').length;
    if (!n && !pl.steer && !everQueued) return;
    const text = summary(pl);
    if (text === lastQueued) return;
    lastQueued = text; everQueued = true;
    window.lavish.queuePrompt(text, { tag: 'hot-seat-round', text: `Round ${pl.round} draft: ${n} of ${pl.answers.length} answered${pl.steer ? ' + steering' : ''}`, queueKey: `hot-seat-round-${pl.round}`, data: { round: pl.round, answered: n, draft: true } });
  }, 700);
}
function payload(final) {
  const answers = round.questions.map((q) => { const a = draft.answers[q.id] || {}; return { id: q.id, choice: a.choice || null, choices: a.choices || [], text: (a.text || '').trim(), dontKnow: !!a.dontKnow, prototype: !!a.prototype, skip: !!a.skip }; });
  const pl = { v: 1, session: S.session, round: round.n, final: !!final, steer: (draft.steer || '').trim(), answers };
  if (themeChoice) pl.theme = themeChoice;
  return pl;
}
function summary(pl) {
  const lines = [`hot-seat round ${pl.round}: answers from the page`];
  round.questions.forEach((q, i) => {
    const a = pl.answers[i]; const s = stance(q, a); const ch = a.choices && a.choices.length ? a.choices : arr(a.choice);
    const labs = ch.map((id) => `(${id}) ${(q.choices || []).find((c) => c.id === id)?.label || id}`).join(' + ');
    lines.push(`${q.id} [${s}] ${q.title}${labs ? ' -> ' + labs : ''}${a.text ? ` | words: ${JSON.stringify(a.text)}` : ''}${a.prototype ? ' | needs a prototype' : ''}${a.skip ? ' | OUT OF SCOPE' : ''}`);
  });
  if (pl.steer) lines.push(`steer: ${JSON.stringify(pl.steer)}`);
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(pl))));
  return `${lines.join('\n')}\n\nHOTSEAT:v1:${b64}`;
}
function send() {
  let bad = false;
  round.questions.forEach((q) => {
    const el = document.querySelector(`[data-err="${q.id}"]`); if (el) el.textContent = '';
    const a = draft.answers[q.id] || {};
    if (q.required && !(a.text || '').trim()) { bad = true; el.textContent = 'This one is required.'; }
    if (q.kind === 'confirm' && a.choice === 'no' && !(a.text || '').trim()) { bad = true; el.textContent = 'Say what is off.'; }
  });
  if (bad) { const first = document.querySelector('.err-msg:not(:empty)'); if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  const pl = payload(true); const text = summary(pl);
  if (inLavish()) {
    const n = pl.answers.filter((a) => stance(round.questions.find((q) => q.id === a.id), a) !== 'open').length;
    window.lavish.queuePrompt(text, { tag: 'hot-seat-round', text: `Round ${pl.round}: ${n} of ${pl.answers.length} answered${pl.steer ? ' + steering' : ''}`, queueKey: `hot-seat-round-${pl.round}`, data: { round: pl.round, answered: n } });
    if (typeof window.lavish.sendQueuedPrompts === 'function') window.lavish.sendQueuedPrompts();
    sentAt = Date.now(); store.set(SENT_KEY, sentAt); rerenderMain();
  } else {
    navigator.clipboard && navigator.clipboard.writeText(text).catch(() => {});
    alert('Not running under Lavish: the answers were copied to your clipboard. Paste them to the agent.');
  }
}
const scroller = () => document.getElementById('scroll');
function rerenderMain() { const m = document.querySelector('.hs-main'); const sc = scroller(); const y = sc.scrollTop; m.outerHTML = mainCol(); sc.scrollTop = y; activeQ = null; setActive(initialActive()); refresh(); }
const initialActive = () => { const q = round.questions.find((x) => stance(x, draft.answers[x.id]) === 'open') || round.questions[0]; return q ? q.id : null; };

document.addEventListener('input', (e) => {
  const t = e.target; if (!(t instanceof HTMLElement)) return;
  if (t.id === 'steer') { draft.steer = t.value; refresh(); return; }
  const q = t.dataset.q; if (!q) return; const a = A(q); const role = t.dataset.role;
  if (role === 'text') a.text = t.value;
  else if (role === 'dontKnow') { a.dontKnow = t.checked; if (t.checked) { a.skip = false; const sk = document.querySelector(`input[data-role=skip][data-q="${q}"]`); if (sk) sk.checked = false; a.choice = null; a.choices = []; document.querySelectorAll(`input[name="${q}"]`).forEach((i) => (i.checked = false)); } }
  else if (role === 'skip') { a.skip = t.checked; if (t.checked) { a.dontKnow = false; const dk = document.querySelector(`input[data-role=dontKnow][data-q="${q}"]`); if (dk) dk.checked = false; a.choice = null; a.choices = []; document.querySelectorAll(`input[name="${q}"]`).forEach((i) => (i.checked = false)); } }
  else if (role === 'prototype') a.prototype = t.checked;
  else if (role === 'choice') {
    const qq = round.questions.find((x) => x.id === q);
    if (qq.multi) a.choices = [...document.querySelectorAll(`input[name="${q}"]:checked`)].map((i) => i.value); else a.choice = t.value;
    a.dontKnow = false; a.skip = false; for (const r of ['dontKnow', 'skip']) { const f = document.querySelector(`input[data-role=${r}][data-q="${q}"]`); if (f) f.checked = false; }
  }
  refresh();
});
document.addEventListener('focusin', (e) => { const c = e.target.closest && e.target.closest('.hs-card'); if (c) setActive(c.id); });
document.addEventListener('pointerdown', (e) => { const c = e.target.closest && e.target.closest('.hs-card'); if (c) setActive(c.id); });
document.addEventListener('click', (e) => {
  const b = e.target.closest && e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, q = b.dataset.q;
  if (act === 'send') send();
  else if (act === 'theme') { themeChoice = curTheme() === 'light' ? 'dark' : 'light'; store.set('hs:theme', themeChoice); applyTheme(); }
  else if (act === 'accept-low') { round.questions.filter((x) => x.stakes === 'low' && !x.noRecommendation && x.kind !== 'confirm' && stance(x, draft.answers[x.id]) === 'open').forEach((x) => { const a = A(x.id); if (x.kind === 'free') a.text = String(x.recommended); else if (x.multi) a.choices = arr(x.recommended); else a.choice = arr(x.recommended)[0]; }); rerenderMain(); }
  else if (act === 'next-open') { const q = round.questions.find((x) => stance(x, draft.answers[x.id]) === 'open'); if (q) { const el = document.getElementById(q.id); setActive(q.id); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); const t = el.querySelector('textarea, input'); if (t) t.focus({ preventScroll: true }); } }
  else if (act === 'jump') { const sd = document.querySelector('.hs-side'); if (sd) sd.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (act === 'use-reco') { const qq = round.questions.find((x) => x.id === q); const a = A(q); const r = arr(qq.recommended); if (qq.multi) a.choices = r; else a.choice = r[0]; a.dontKnow = false; rerenderMain(); }
  else if (act === 'use-reco-text') { const qq = round.questions.find((x) => x.id === q); A(q).text = String(qq.recommended); A(q).dontKnow = false; rerenderMain(); }
  else if (act === 'tab') { document.querySelectorAll('.tab2').forEach((t) => t.setAttribute('aria-selected', t === b)); document.querySelectorAll('.tabpane').forEach((p) => p.classList.toggle('on', p.id === 'pane-' + b.dataset.tab)); store.set(`hs:tab:${S.session}`, b.dataset.tab); fillPane(b.dataset.tab); }
  else if (act === 'copy-ledger') { const done = () => { const c = document.getElementById('copied'); if (c) c.textContent = 'Copied.'; }; if (navigator.clipboard) navigator.clipboard.writeText(S.ledgerMd).then(done, () => { selectLedger(); }); else selectLedger(); }
  else if (act === 'dl-ledger') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([S.ledgerMd], { type: 'text/markdown' })); a.download = `decisions-ledger-${S.session}.md`; a.click(); }
});
function selectLedger() { const p = document.getElementById('ledger-md'); const r = document.createRange(); r.selectNodeContents(p); const s = getSelection(); s.removeAllRanges(); s.addRange(r); const c = document.getElementById('copied'); if (c) c.textContent = 'Selected: press Ctrl+C.'; }

// ---------------------------------------------------------------- boot
$app.innerHTML = `<div class="hs-app">${header()}<div class="hs-scroll" id="scroll" tabindex="-1"><div class="hs-grid">${mainCol()}${sidebar()}</div></div>${interactive ? bar() : ''}</div>`;
applyTheme();
setActive(initialActive());
refresh();
fillPane(store.get(`hs:tab:${S.session}`) || 'tree');
// the rail's height follows the space left by the top bar and the bottom bar
{ const set = () => document.documentElement.style.setProperty('--chrome', ((document.getElementById('top') || {}).offsetHeight || 0) + ((document.getElementById('bar') || {}).offsetHeight || 0) + 'px'); set(); if (window.ResizeObserver) { const ro = new ResizeObserver(set); ['top', 'bar'].forEach((i) => { const el = document.getElementById(i); if (el) ro.observe(el); }); } }
scroller().focus({ preventScroll: true }); // so PageDown and the space bar scroll the cards right away
})();
</script>
